[project]
name = "stepper"
version = "0.1.0"
description = "The Hacker Fab open source lithography stepper software"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pillow>=10.4.0",
    "toml>=0.10.2",
    "pyside6>=6.6.0",
]

[project.optional-dependencies]
alignment = [
    "ultralytics>=8.3.0",
]
grbl = [
    "pyserial>=3.5",
]
omm = [
    "open-micro-stage-api",
]
basler = [
    "pypylon>=4.1.0",
]
dlpc = [
    "pyusb>=1.2.1",
]


[tool.uv.sources]
open-micro-stage-api = { git = "https://github.com/hacker-fab/MicroManipulatorStepper/", subdirectory = "software/PythonAPI" }

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "pre-commit>=4.6.2",
    "ty>=0.0.80",
    "ruff>=0.9.0",
]

[tool.ruff]
# Set the maximum line length to 100 characters
line-length = 100
exclude = [
	"src/camera/*",
	"src/dlpc.py"
]
# Tell Ruff which Python version you are targeting
target-version = "py310"

[tool.ruff.lint] 
# "E" = pycodestyle errors, "F" = pyflakes (unused imports, etc.), "I" = isort (import sorting)
select = ["E", "F", "I"]

ignore = ["E501"] 

[tool.ruff.format]
# Leave existing single and double quotes exactly as they are
quote-style = "preserve"

# Indent with spaces instead of tabs
indent-style = "space"

[tool.ty]

[tool.ty.src]
# Explicitly tell it which folders to check
include = ["src/*"]
