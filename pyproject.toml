[project]
name = "stepper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "open-micro-stage-api",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0",
    "pypylon>=4.1.0",
    "pyserial>=3.5",
    "pyusb>=1.2.1",
    "toml>=0.10.2",
    "ultralytics>=8.3.218",
    "onnxruntime>=1.19.0,<1.22.0",
    "screeninfo>=0.8.1",
]

[tool.uv.sources]
open-micro-stage-api = { git = "https://github.com/hacker-fab/MicroManipulatorStepper/", subdirectory = "software/PythonAPI" }

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "pre-commit>=4.6.2",
    "ty>=0.0.80",
]

[tool.ruff]
# Set the maximum line length to 88 characters (standard Python convention)
line-length = 120
exclude = [
	"src/camera/*",
	"src/lib/*",
	"src/hardware.py",
	"src/dlpc.py"
]
# Tell Ruff which Python version you are targeting
target-version = "py310"

[tool.ruff.lint]
# Which rules to check. 
# "E" = pycodestyle errors, "F" = pyflakes (unused imports, etc.), "I" = isort (import sorting)
select = ["E", "F", "I"]

ignore = ["E711", "F405", "F403"] 

[tool.ruff.format]
# Leave existing single and double quotes exactly as they are
quote-style = "preserve"

# Indent with spaces instead of tabs
indent-style = "space"

[tool.ty]

[tool.ty.src]
# Explicitly tell it which folders to check
include = ["src/gui.py"]
# Which directories/files to skip
# exclude = ["<insert>"]
