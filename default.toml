[camera]
# camera type, can be "dummy", "webcam", or "pylon"
type = "webcam"

[camera.dummy]
width = 640
height = 480

[camera.webcam]
index = 0

[camera.pylon]
index = 0

######

[stage]
# stage type, can be dummy, omm, or grbl
type = "omm"

[stage.dummy]

[stage.omm]
port = "COM6"
baud-rate = 921600

[stage.grbl]
port = "COM6"
baud-rate = 115200
# Set homing to false if your stage does not have limit sensors
homing = false


######


[projector]
# This section configures the DLPC6540 projector controller over USB.
# When enabled, the software will hardware-disable LED channels whose image
# channel is zeroed out (e.g. red LED off during UV exposure, blue LED off
# during red alignment mode). This prevents stray light from unused channels.

# Set to true to enable USB control of the DLPC6540 via pyusb.
dlpc_enabled = false
# Optional USB product ID to disambiguate if multiple TI devices are present.
# Leave unset (comment out) to auto-select the first TI (VID=0x0451) device.
# dlpc_pid = 0x6401

# UV (blue channel) LED drive current level, 0-400. Values outside this range,
# or if unset, fall back to the safe default of 150. Red/Green always default to 150.
# OutputCurrent = ((DriveLevel + 1)/1024)*((0.15/0.036)) // confirm the eqn for your DLPC projector model
# uv_led_drive_level = 150


[tiling]
enabled = false

[autofocus]
enabled = true
# UV-Red Z focal offset in micrometers (chromatic aberration offset)
uv_z_offset = 0.0
# Minimum ArUco tag detection rate required to continue refinement (0.0 to 1.0)
min_detection_rate = 0.5

# This section configures alignment marker detection
[alignment]
# Enable or disable real-time detection of alignment markers
enabled = false
# Path to the YOLO model weights file
model_path = "ckpts/best.pt"
# Alignment marker reference coordinates (in pixels)
right_marker_x = 1820.0  # x-coordinate for markers on the right side
top_marker_y = 269.0     # y-coordinate for markers on the top
bottom_marker_y = 1075.0 # y-coordinate for markers on the bottom
left_marker_x = 280.0    # x-coordinate for markers on the left side
# Scaling factors for converting normalized differences to stage movements (in µm)
x_scale_factor = -1100 # Scaling factor for x-axis movements
y_scale_factor = 800   # Scaling factor for y-axis movements
